name: lint

# Code quality only. This workflow does NOT publish the website - that is
# pages.yml, which runs independently. A lint failure must never stop the site
# from deploying.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # -x lets shellcheck follow the `source common.sh` in each installer.
      - name: Lint the install scripts
        run: shellcheck -x -S style docs/scripts/*.sh tools/*.sh

      - name: Check every script parses
        run: |
          for script in docs/scripts/*.sh tools/*.sh; do
            bash -n "$script"
          done

  powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Settings live in .github/PSScriptAnalyzerSettings.psd1, which documents
      # why a couple of module-oriented rules are excluded for a console
      # installer.
      - name: Lint the WSL installer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer `
              -Path docs/scripts/install_ubuntu_wsl.ps1 `
              -Settings .github/PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Output "No issues found."

  links:
    name: internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links resolve
        run: ./tools/check_links.sh docs
